name: gp_frontend
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  uuid: ^4.5.1
  device_info_plus: ^11.1.1
  crypto: ^3.0.6
  url_launcher: ^6.1.7
  flutter:
    sdk: flutter
  provider: ^6.0.0
  device_preview: ^1.2.0
  video_player: ^2.10.0
  photo_manager: ^3.7.1
  video_thumbnail: ^0.5.3
  file_picker: ^10.1.9
  image_picker: ^1.1.2
  graphql_flutter: ^5.0.0
  google_fonts: ^6.2.1
  firebase_messaging: ^15.2.4
  intl: ^0.19.0
  dotted_border: ^2.0.0
  dio: ^5.8.0+1
  webview_flutter: ^4.2.2
  flutter_map: ^8.1.1
